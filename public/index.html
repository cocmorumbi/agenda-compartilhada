<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Agenda de compromissos - COC Morumbi</title>
  <style>
    body { 
      margin: 0; 
      font-family: Arial, sans-serif; 
      display: flex; 
      height: 100vh; 
      background-color: #f4f7f6;
      overflow: hidden; /* Mantém a tela fixa na área de trabalho */
    }
    header { 
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      background: #3A6604; 
      color: white; 
      padding: 20px; 
      text-align: center; 
      font-size: 20px; 
      font-weight: bold; 
      z-index: 1000; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .sidebar { 
      margin-top: 60px; 
      width: 220px; 
      background: #99CD85; 
      display: flex; 
      flex-direction: column; 
      padding: 20px; 
      box-sizing: border-box;
      flex-shrink: 0;
    }
    .sidebar div { 
      margin: 10px 0; 
      padding: 14px; 
      cursor: pointer; 
      text-align: center; 
      border-radius: 8px; 
      font-weight: bold; 
      background: #3A6604; 
      color: white; 
      transition: all 0.3s ease; 
    }
    .sidebar div:hover { 
      background: rgba(255, 255, 255, 0.3); 
      transform: scale(1.03); 
    }
    .sidebar div.active { 
      background: linear-gradient(45deg, #ffd700, #ffff99); 
      color: #111; 
      box-shadow: 0 0 12px rgba(255, 255, 0, 0.8); 
    }
    .main { 
      flex: 1; 
      padding: 100px 40px 40px 40px; 
      overflow-y: auto; 
      background: #ffffff;
    }
    .calendar-controls { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 20px; 
      margin-bottom: 25px; 
    }
    .calendar-controls button { 
      background: #3A6604; 
      color: white; 
      border: none; 
      border-radius: 50%; 
      width: 40px; 
      height: 40px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 16px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.2); 
      transition: background 0.3s ease, transform 0.2s ease; 
    }
    .calendar-controls button:hover { 
      background: #2a4703; 
      transform: scale(1.1); 
    }
    .calendar { 
      display: grid; 
      grid-template-columns: repeat(7, 1fr); 
      gap: 10px; 
      margin-bottom: 25px; 
      animation: fadeIn 0.4s ease; 
    }
    .day { 
      border: 2px solid #ddd; 
      padding: 20px 10px; 
      text-align: center; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      background: #fafafa;
      min-height: 50px;
      transition: all 0.2s ease; 
    }
    .day:hover { 
      transform: scale(1.03); 
      background: #eaffea; 
      border-color: #3A6604;
    }
    .day.has-event { 
      background: #d1ffd1; 
      border-color: #99CD85;
    }
    .day.full { 
      background: #ffb3b3; 
      border-color: #ff4d4d;
    }
    .day.today { 
      border: 3px solid #83E509; 
    }
    .agenda { 
      display: none; 
      border-top: 3px solid #99CD85; 
      padding-top: 20px; 
      opacity: 0; 
      transition: opacity 0.3s ease; 
    }
    .agenda.active { 
      display: block; 
      opacity: 1; 
    }
    .slot { 
      border: 1px solid #ccc; 
      padding: 12px; 
      margin: 8px 0; 
      border-radius: 6px;
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #fdfdfd;
    }
    .slot.booked { 
      background: linear-gradient(90deg, #ffe5e5, #ffcccc); 
      border-left: 5px solid red; 
      font-weight: bold; 
    }
    .cancel-btn { 
      background: #ff4d4d; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      padding: 6px 12px; 
      cursor: pointer; 
      font-size: 13px; 
      transition: background 0.3s ease; 
    }
    .cancel-btn:hover { 
      background: #cc0000; 
    }
    .marcar-btn { 
      background: #3A6604; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      padding: 6px 12px; 
      cursor: pointer; 
      font-size: 13px; 
    }
    .marcar-btn:hover {
      background: #2a4703;
    }
    #mes-atual { 
      font-size: 22px; 
      font-weight: bold; 
      text-align: center; 
      color: #333; 
      min-width: 200px; 
    }
    #nav-mes { 
      display: none; 
    }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(6px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
  </style>
</head>
<body>
  <header>Agenda de compromissos - COC Morumbi</header>

  <div class="sidebar">
    <div onclick="selecionarPessoa('Andreia', event)">Andréia</div>
    <div onclick="selecionarPessoa('Ana Paula', event)">Ana Paula</div>
    <div onclick="selecionarPessoa('Maria Julia', event)">Maria Júlia</div>
    <div onclick="selecionarPessoa('Priscila', event)">Priscila</div>
    <div onclick="selecionarPessoa('Carla', event)">Carla</div>
    <div onclick="abrirHoje(event)">📅 Hoje</div>
  </div>

  <div class="main">
    <h2 id="pessoa-titulo">Selecione uma pessoa na barra lateral</h2>

    <div id="nav-mes" class="calendar-controls">
      <button onclick="mudarMes(-1)">⏮</button>
      <div id="mes-atual"></div>
      <button onclick="mudarMes(1)">⏭</button>
    </div>

    <div id="calendar" class="calendar"></div>
    <div id="agenda" class="agenda"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
